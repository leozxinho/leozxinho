<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Leonardo de Oliveira, Backend Developer: Python, FastAPI, Clean Architecture">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.lbl{fill:#5b8bd6;font-size:13px;letter-spacing:.5px}
.val{fill:#d7ecff;font-size:13px}
.head{fill:#7dd3fc;font-size:14px;font-weight:700}
.sec{fill:#38bdf8;font-size:12px;font-weight:700;letter-spacing:2px}
.dim{fill:#3e6aa8;font-size:11px;letter-spacing:1.5px}
.dots{stroke:#1f3f6e;stroke-width:1;stroke-dasharray:1 4}
.asc{font-size:9.5px;fill:url(#holo)}
.cover{fill:#040c1a;transform-box:fill-box;transform-origin:100% 50%;animation:type .6s steps(26,end) forwards}
@keyframes type{to{transform:scaleX(0)}}
.curtain{fill:#040c1a;transform-box:fill-box;transform-origin:50% 100%;animation:reveal 2.4s cubic-bezier(.2,.7,.2,1) .2s forwards}
@keyframes reveal{to{transform:scaleY(0)}}
.flicker{animation:flicker 6s infinite}
@keyframes flicker{0%,100%{opacity:.95}46%{opacity:.95}47%{opacity:.55}48%{opacity:1}49%{opacity:.7}50%{opacity:.95}88%{opacity:.9}89%{opacity:.6}90%{opacity:.95}}
.glitch{animation:glitch 7s infinite}
@keyframes glitch{0%,92%,100%{transform:translate(0,0)}93%{transform:translate(-3px,0)}94%{transform:translate(3px,1px)}95%{transform:translate(-1px,-1px)}96%{transform:translate(0,0)}}
.scan{animation:scan 3.6s linear infinite}
@keyframes scan{0%{transform:translateY(-60px)}100%{transform:translateY(504px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.grid{animation:grid 14s linear infinite}
@keyframes grid{to{transform:translateY(24px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.cover,.curtain{display:none}}
</style>
